services:
  backend:
    build: ./backend
    env_file: ./backend/.env          # change to ./.env if your .env is in the project root
    environment:
      DATABASE_URL: sqlite:////data/reviews.db   # overrides .env, lives on the volume
    volumes:
      - db_data:/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
