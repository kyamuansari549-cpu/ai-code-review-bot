server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 6m;   # screenshots are sent as base64 (nginx default is 1m)

  # API calls go to the backend container (same idea as the Vite dev proxy)
  location /reviews {
    proxy_pass http://backend:8000;
    proxy_read_timeout 120s;   # LLM calls can take a while
  }

  location /chats {
    proxy_pass http://backend:8000;
    proxy_read_timeout 120s;
  }

  location /health {
    proxy_pass http://backend:8000;
  }

  location / {
    try_files $uri /index.html;
  }
}
